openapi: 3.1.0

info:
  title: Syntra REST API
  version: 0.1.0
  description: |
    Endpoint REST Syntra. Bagian realtime didokumentasikan terpisah di
    api/asyncapi.yaml.

    Seluruh respons memakai pembungkus yang sama:
      sukses  -> {"data": ..., "meta": ...}
      gagal   -> {"error": {"code": "...", "message": "...", "request_id": "..."}}

    Kode error identik dengan kode di protokol WebSocket, sehingga klien cukup
    punya satu penerjemah error untuk kedua transport.

servers:
  - url: http://localhost:8080
    description: lokal

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      description: Tidak menyentuh dependensi apa pun. Selalu 200 selama proses hidup.
      responses:
        '200': { description: proses hidup }

  /readyz:
    get:
      summary: Readiness probe
      security: []
      description: Memeriksa Postgres dan Redis.
      responses:
        '200': { description: siap menerima trafik }
        '503': { description: ada dependensi yang tidak sehat }

  /api/v1/conversations:
    get:
      summary: Daftar percakapan milik pengguna
      parameters:
        - { name: limit,  in: query, schema: { type: integer, default: 30, maximum: 100 } }
        - name: before
          in: query
          description: Cursor waktu (RFC3339). Ambil dari meta.next_before halaman sebelumnya.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  meta:
                    type: object
                    properties:
                      count:       { type: integer }
                      next_before: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/conversations/{id}/messages:
    post:
      summary: Kirim pesan
      description: |
        Jalur cadangan untuk pengiriman pesan ketika WebSocket sedang terputus.
        Memanggil service domain yang sama persis dengan frame `message.send`,
        jadi validasi dan otorisasinya identik.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:        { type: string, enum: [text, media, voice_note, story_reply] }
                body:        { type: string, maxLength: 4000 }
                reply_to_id: { type: string, format: uuid }
      responses:
        '201':
          description: pesan tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: kegagalan
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:       { type: string }
                  message:    { type: string }
                  request_id: { type: string }

  schemas:
    Conversation:
      type: object
      properties:
        id:              { type: string, format: uuid }
        type:            { type: string, enum: [direct, group] }
        title:           { type: string }
        unread_count:    { type: integer }
        last_message_at: { type: string, format: date-time }
        created_at:      { type: string, format: date-time }

    Message:
      type: object
      properties:
        id:              { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id:       { type: string, format: uuid }
        type:            { type: string }
        body:            { type: string }
        reply_to_id:     { type: string, format: uuid }
        created_at:      { type: string, format: date-time }
