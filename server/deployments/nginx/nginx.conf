# nginx sebagai reverse proxy di depan server Syntra.
#
# Jalankan (dari folder berkas ini):
#   nginx -p . -c nginx.conf
#   nginx -p . -c nginx.conf -s reload    # muat ulang setelah diubah
#   nginx -p . -c nginx.conf -s quit      # hentikan
#
# Alur:
#   internet -> Tailscale Funnel (TLS) -> nginx :8081 -> Go :8080
#
# nginx TIDAK menangani TLS di sini. Sertifikat diurus Funnel, jadi tidak ada
# kunci privat yang perlu disimpan di laptop ini.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # mime.types sengaja tidak di-include: ini API JSON murni, dan include
    # berbasis path relatif justru bikin repot saat nginx dijalankan dengan -p.
    default_type application/json;

    access_log logs/access.log;
    error_log  logs/error.log warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;   # jangan umumkan versi nginx

    # Server Go menolak body di atas 1 MB. Batas di sini sedikit lebih longgar
    # supaya penolakannya datang dari aplikasi — lengkap dengan pesan JSON —
    # bukan dari nginx berupa halaman HTML yang tidak bisa diproses klien.
    client_max_body_size 2m;

    # Wajib untuk WebSocket: header Connection harus "upgrade" saat ada
    # header Upgrade, dan "close" saat tidak ada.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Funnel sudah menerminasi TLS, jadi $scheme di sini selalu http.
    # Skema asli dibaca dari header yang dikirim Funnel.
    map $http_x_forwarded_proto $real_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # Aplikasi belum punya rate limiting sendiri. Selama belum ada, batas di
    # sini adalah satu-satunya yang berdiri antara server dan siapa pun yang
    # menemukan alamat publiknya.
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream syntra {
        server 127.0.0.1:8080;

        # Koneksi ke backend dipakai ulang. Tanpa ini setiap request membuka
        # soket TCP baru ke Go, dan pada trafik ramai port ephemeral Windows
        # bisa habis.
        keepalive 32;
    }

    # Cache media di disk: nginx menarik tiap objek dari Supabase Storage SEKALI,
    # menyimpannya, lalu melayani sisanya dari cache — memangkas egress Supabase.
    # URL media immutable (media id ada di path), jadi TTL sangat panjang.
    # Dipakai oleh location /mediacdn/ di bawah.
    proxy_cache_path cache/media levels=1:2 keys_zone=media_cache:10m
                     max_size=2g inactive=90d use_temp_path=off;

    server {
        listen      8081;
        server_name _;

        add_header X-Content-Type-Options nosniff  always;
        add_header X-Frame-Options        DENY     always;
        add_header Referrer-Policy        no-referrer always;

        # ---- WebSocket ----
        location /api/v1/ws {
            proxy_pass http://syntra;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;

            # Buffering dimatikan supaya frame diteruskan seketika. Kalau
            # dibiarkan menyala, nginx menahan pesan sampai buffernya penuh —
            # chat jadi terasa tersendat tanpa sebab yang jelas.
            proxy_buffering off;

            # Koneksi socket berumur panjang. Nilai bawaan 60 detik akan
            # memutusnya secara berkala dan terlihat seperti gangguan jaringan
            # acak. Server sendiri sudah menjaga kesehatan koneksi lewat
            # ping/pong tiap 25 detik.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            limit_conn conn 10;
        }

        # ---- probe kesehatan ----
        # Tanpa rate limit dan tanpa access log: probe dipanggil terus-menerus
        # dan hanya akan menenggelamkan log yang berguna.
        location = /healthz {
            proxy_pass http://syntra;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://syntra;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ---- cache media (proxy ke Supabase Storage) ----
        # api.syntra.fun/mediacdn/<bucket>/<key>  ->  objek publik Supabase, di-cache.
        # Aktif saat backend diset SUPABASE_MEDIA_CDN_BASE=https://api.syntra.fun/mediacdn.
        # Karena api.syntra.fun sudah di belakang Cloudflare dan berkas ini punya
        # ekstensi (.jpg/.mp4), Cloudflare ikut men-cache di edge — laptop pun lega.
        location /mediacdn/ {
            set $supa_host "tqcfmueshhpuqjuqgafi.supabase.co";
            resolver 1.1.1.1 8.8.8.8 valid=300s;
            resolver_timeout 5s;

            # /mediacdn/media/<key> -> /storage/v1/object/public/media/<key>
            rewrite ^/mediacdn/(.*)$ /storage/v1/object/public/$1 break;
            proxy_pass https://$supa_host;
            proxy_set_header Host $supa_host;
            proxy_ssl_server_name on;
            proxy_set_header Cookie        "";   # objek publik: jangan teruskan kredensial
            proxy_set_header Authorization "";

            proxy_cache media_cache;
            proxy_cache_key   $uri;              # path Supabase (post-rewrite), stabil per objek
            proxy_cache_valid 200 90d;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;                 # cache-fill serempak = satu tarikan, bukan berebut
            proxy_cache_use_stale error timeout updating;
            proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
            proxy_hide_header Set-Cookie;

            # Immutable: aman di-cache lama oleh klien & Cloudflare.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Media-Cache $upstream_cache_status always;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ---- REST dan sisanya ----
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://syntra;

            proxy_http_version 1.1;
            proxy_set_header Connection "";   # aktifkan keepalive ke upstream

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Balasan penolakan tetap berbentuk JSON, sama seperti error dari
        # aplikasi, supaya klien tidak perlu menangani halaman HTML nginx.
        error_page 429 = @too_many;
        location @too_many {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"terlalu banyak permintaan"}}';
        }

        error_page 502 503 504 = @upstream_down;
        location @upstream_down {
            default_type application/json;
            return 503 '{"error":{"code":"internal","message":"server sedang tidak tersedia"}}';
        }
    }
}
